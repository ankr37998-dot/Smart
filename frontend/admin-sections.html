<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="app-api-base" content="" />
    <title>Sections - Smart Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#edf6ff",
                100: "#dfeeff",
                500: "#0a84ff",
                600: "#0071e3",
                700: "#0057b8",
              },
            },
            boxShadow: {
              soft: "0 18px 42px rgba(15, 23, 42, 0.06)",
            },
          },
        },
      };
    </script>
    <link
      rel="stylesheet"
      href="assets/css/styles.css?v=20260922-layout-fix-v1"
    />
  </head>
  <body class="app-shell bg-[#f5f5f7] text-slate-900 antialiased">
    <div class="app-shell__layout flex min-h-screen">
      <aside
        class="desktop-sidebar sidebar w-[260px] border-r border-slate-200 bg-white/80 shadow-soft"
      >
        <h2>🎓 Smart Attendance</h2>
        <div class="sidebar-content">
          <a href="admin-dashboard.html" class="sidebar-btn" id="dashboardBtn" data-page="dashboard">
            📊 Dashboard
          </a>
          <a href="admin-users.html" class="sidebar-btn" id="createUserBtn" data-page="users">
            👥 Manage Users
          </a>
          <a href="admin-departments.html" class="sidebar-btn" id="departmentsBtn" data-page="departments">
            🏛️ Departments
          </a>
          <a href="admin-sections.html" class="sidebar-btn active" id="sectionsBtn" data-page="sections">
            🗂️ Sections
          </a>
          <a href="admin-courses.html" class="sidebar-btn" id="coursesBtn" data-page="courses">
            📚 Courses
          </a>
          <a href="admin-timetable.html" class="sidebar-btn" id="timetableBtn" data-page="timetable">
            📅 Timetable
          </a>
          <a href="admin-face-id.html" class="sidebar-btn" id="faceRegsBtn" data-page="face-id">
            👤 Face ID
          </a>
          <a href="admin-promote.html" class="sidebar-btn" id="promoteBtn" data-page="promote">
            🎓 Promote
          </a>
          <a href="admin-analytics.html" class="sidebar-btn" id="analyticsBtn" data-page="analytics">
            📈 Analytics
          </a>
        </div>

        <div class="sidebar-footer">
          <a href="admin-profile.html" class="sidebar-btn" id="profileBtn" data-page="profile">👤 Profile</a>
          <button class="sidebar-btn" id="logoutBtn">🚪 Logout</button>
        </div>
      </aside>

      <main class="app-shell__main">
        <section class="desktop-dashboard">
          <div class="main-content">
            <div class="container">
              <div id="sectionsView">
                <h3 class="section-gap">Manage Sections</h3>

                <div id="sectionCreateCard" class="card section-gap hidden">
                  <h4 id="sectionFormTitle">➕ Create Section</h4>
                  <form
                    id="createSectionForm"
                    class="grid gap-sm align-end section-gap-sm"
                  >
                    <div class="form-group">
                      <label>Department</label>
                      <select id="secDepartment" required>
                        <option value="">Select Department</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label>Section Name</label>
                      <input
                        type="text"
                        id="secName"
                        placeholder="e.g., A1, A2, B1"
                        required
                      />
                    </div>
                    <div class="form-group">
                      <label>Description (Optional)</label>
                      <input
                        type="text"
                        id="secDescription"
                        placeholder="e.g., Morning Batch"
                      />
                    </div>
                    <div class="department-form-actions">
                      <button
                        type="button"
                        id="closeCreateSectionBtn"
                        class="btn-secondary"
                      >
                        Cancel
                      </button>
                      <button type="submit" id="sectionSubmitBtn">
                        Add Section
                      </button>
                    </div>
                  </form>
                  <p id="secMsg" class="error-msg"></p>
                </div>

                <div id="sectionListCard" class="card">
                  <div class="flex-between">
                    <h4>📋 Section List</h4>
                    <div class="department-list-actions">
                      <select
                        id="sectionFilterDept"
                        class="form-control"
                        aria-label="Filter sections by department"
                      >
                        <option value="">All Departments</option>
                      </select>
                      <button
                        type="button"
                        id="showCreateSectionBtn"
                        class="btn-info"
                      >
                        + Add Section
                      </button>
                    </div>
                  </div>
                  <div class="panel-scroll">
                    <table class="table-fill">
                      <thead>
                        <tr>
                          <th>Section</th>
                          <th>Department</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody id="sectionListBody">
                        <tr>
                          <td colspan="3" class="text-center">Loading...</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="config.js?v=20260526"></script>
    <script>
      // Set active sidebar link based on current page
      document.addEventListener('DOMContentLoaded', function() {
        const currentPage = window.location.pathname.split('/').pop().replace('.html', '') || 'dashboard';
        const sidebarBtns = document.querySelectorAll('.sidebar-btn[data-page]');
        sidebarBtns.forEach(btn => {
          if (btn.dataset.page === currentPage) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
      });
    </script>
    <script type="module" src="assets/js/admin-sections.js?v=20260922"></script>
    <script type="module" src="assets/js/mobile-nav.js?v=20260526"></script>
    <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
      <a href="admin-dashboard.html" class="mobile-nav-item" data-target="dashboardBtn">
        <span>🏠</span><span>Dashboard</span>
      </a>
      <a href="admin-users.html" class="mobile-nav-item" data-target="createUserBtn">
        <span>👥</span><span>Users</span>
      </a>
      <a href="admin-analytics.html" class="mobile-nav-item" data-target="analyticsBtn">
        <span>📈</span><span>Analytics</span>
      </a>
      <a href="admin-profile.html" class="mobile-nav-item" data-target="profileBtn">
        <span>👤</span><span>Profile</span>
      </a>
    </nav>
  </body>
</html>
