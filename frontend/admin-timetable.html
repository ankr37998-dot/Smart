<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="app-api-base" content="" />
    <title>Timetable - Smart Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#edf6ff",
                100: "#dfeeff",
                500: "#0a84ff",
                600: "#0071e3",
                700: "#0057b8",
              },
            },
            boxShadow: {
              soft: "0 18px 42px rgba(15, 23, 42, 0.06)",
            },
          },
        },
      };
    </script>
    <link
      rel="stylesheet"
      href="assets/css/styles.css?v=20260922-layout-fix-v1"
    />
  </head>
  <body class="app-shell bg-[#f5f5f7] text-slate-900 antialiased">
    <div class="app-shell__layout flex min-h-screen">
      <aside
        class="desktop-sidebar sidebar w-[260px] border-r border-slate-200 bg-white/80 shadow-soft"
      >
        <h2>🎓 Smart Attendance</h2>
        <div class="sidebar-content">
          <a href="admin-dashboard.html" class="sidebar-btn" id="dashboardBtn" data-page="dashboard">
            📊 Dashboard
          </a>
          <a href="admin-users.html" class="sidebar-btn" id="createUserBtn" data-page="users">
            👥 Manage Users
          </a>
          <a href="admin-departments.html" class="sidebar-btn" id="departmentsBtn" data-page="departments">
            🏛️ Departments
          </a>
          <a href="admin-sections.html" class="sidebar-btn" id="sectionsBtn" data-page="sections">
            🗂️ Sections
          </a>
          <a href="admin-courses.html" class="sidebar-btn" id="coursesBtn" data-page="courses">
            📚 Courses
          </a>
          <a href="admin-timetable.html" class="sidebar-btn active" id="timetableBtn" data-page="timetable">
            📅 Timetable
          </a>
          <a href="admin-face-id.html" class="sidebar-btn" id="faceRegsBtn" data-page="face-id">
            👤 Face ID
          </a>
          <a href="admin-promote.html" class="sidebar-btn" id="promoteBtn" data-page="promote">
            🎓 Promote
          </a>
          <a href="admin-analytics.html" class="sidebar-btn" id="analyticsBtn" data-page="analytics">
            📈 Analytics
          </a>
        </div>

        <div class="sidebar-footer">
          <a href="admin-profile.html" class="sidebar-btn" id="profileBtn" data-page="profile">👤 Profile</a>
          <button class="sidebar-btn" id="logoutBtn">🚪 Logout</button>
        </div>
      </aside>

      <main class="app-shell__main">
        <section class="desktop-dashboard">
          <div class="main-content">
            <div class="container">
              <div id="timetableView">
                <h3 class="section-gap">Manage Weekly Schedule</h3>

                <!-- Select Faculty -->
                <div id="timetableWorkspace" class="card section-gap">
                  <!-- Add Slot Form -->
                  <div id="addSlotCard" class="card section-gap hidden">
                    <h4>➕ Add Class to Schedule</h4>
                    <form id="addSlotForm" class="grid gap-sm section-gap-sm">
                      <div class="form-group">
                        <label>Day</label>
                        <select id="slotDay" required>
                          <option value="monday">Monday</option>
                          <option value="tuesday">Tuesday</option>
                          <option value="wednesday">Wednesday</option>
                          <option value="thursday">Thursday</option>
                          <option value="friday">Friday</option>
                          <option value="saturday">Saturday</option>
                        </select>
                      </div>
                      <div class="form-group">
                        <label>Start Time</label>
                        <select id="slotStart" required>
                          <option value="">Select Start Time</option>
                          <option value="09:30">9:30 AM</option>
                          <option value="10:30">10:30 AM</option>
                          <option value="11:30">11:30 AM</option>
                          <option value="12:30">12:30 PM</option>
                          <option value="14:10">2:10 PM</option>
                          <option value="15:10">3:10 PM</option>
                        </select>
                      </div>
                      <div class="form-group">
                        <label>End Time</label>
                        <select id="slotEnd" required>
                          <option value="">Select End Time</option>
                          <option value="10:30">10:30 AM</option>
                          <option value="11:30">11:30 AM</option>
                          <option value="12:30">12:30 PM</option>
                          <option value="13:30">1:30 PM</option>
                          <option value="14:10">2:10 PM</option>
                          <option value="15:10">3:10 PM</option>
                          <option value="16:10">4:10 PM</option>
                        </select>
                      </div>
                      <div class="form-group">
                        <label>Course (Faculty's Classes)</label>
                        <select id="slotCourse" required>
                          <option value="">Select Course</option>
                        </select>
                      </div>
                      <div class="form-group">
                        <label>Section</label>
                        <select id="slotSection">
                          <option value="">Select Section</option>
                        </select>
                      </div>
                    </form>
                    <div class="timetable-form-actions">
                      <button
                        type="button"
                        id="closeAddSlotBtn"
                        class="btn-secondary"
                      >
                        Cancel
                      </button>
                      <button type="button" id="addSlotBtn">
                        Add to Schedule
                      </button>
                    </div>
                    <p id="slotMsg" class="error-msg"></p>
                  </div>

                  <!-- Weekly Schedule Display -->
                  <div class="timetable-schedule-panel">
                    <div class="flex-between">
                      <h4>Faculty Weekly Schedule</h4>
                      <div class="timetable-header-actions">
                        <select
                          id="ttDepartmentFilter"
                          aria-label="Filter by department"
                        >
                          <option value="">All Departments</option>
                        </select>
                        <select id="ttFaculty" required aria-label="Faculty">
                          <option value="">Select Faculty</option>
                        </select>
                        <span
                          id="scheduleStatus"
                          class="text-success text-small"
                        ></span>
                        <button
                          type="button"
                          id="saveScheduleBtn"
                          class="btn-success"
                        >
                          💾 Save Schedule
                        </button>
                      </div>
                    </div>
                    <div class="section-gap-sm overflow-x-auto">
                      <table id="adminTimetable" class="table-fill">
                        <thead id="adminTimetableHead">
                          <tr>
                            <th>Day</th>
                          </tr>
                        </thead>
                        <tbody id="adminTimetableBody">
                          <tr>
                            <td class="text-center text-muted">
                              Select a faculty to view schedule
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="config.js?v=20260526"></script>
    <script>
      // Set active sidebar link based on current page
      document.addEventListener('DOMContentLoaded', function() {
        const currentPage = window.location.pathname.split('/').pop().replace('.html', '') || 'dashboard';
        const sidebarBtns = document.querySelectorAll('.sidebar-btn[data-page]');
        sidebarBtns.forEach(btn => {
          if (btn.dataset.page === currentPage) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
      });
    </script>
    <script type="module" src="assets/js/admin-timetable.js?v=20260922"></script>
    <script type="module" src="assets/js/mobile-nav.js?v=20260526"></script>
    <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
      <a href="admin-dashboard.html" class="mobile-nav-item" data-target="dashboardBtn">
        <span>🏠</span><span>Dashboard</span>
      </a>
      <a href="admin-users.html" class="mobile-nav-item" data-target="createUserBtn">
        <span>👥</span><span>Users</span>
      </a>
      <a href="admin-analytics.html" class="mobile-nav-item" data-target="analyticsBtn">
        <span>📈</span><span>Analytics</span>
      </a>
      <a href="admin-profile.html" class="mobile-nav-item" data-target="profileBtn">
        <span>👤</span><span>Profile</span>
      </a>
    </nav>
  </body>
</html>
